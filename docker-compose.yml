version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ares_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required. Please set it in your .env file.}
      POSTGRES_DB: ${POSTGRES_DB:-ares_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ares_user} -d ${POSTGRES_DB:-ares_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Connects API container to the Compose database service hostname 'db' on port 5432.
      # Guarantees consistent credentials with the db service without nested expansion issues.
      DATABASE_URL: postgresql://${POSTGRES_USER:-ares_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ares_db}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required. Please set it in your .env file.}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
